services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegisops_test
      POSTGRES_USER: aegisops_test
      POSTGRES_PASSWORD: isolated-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops_test -d aegisops_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc}
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/isolated-test-only
      NEO4J_dbms_memory_heap_initial__size: 128m
      NEO4J_dbms_memory_heap_max__size: 256m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7687'"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 15s
  tests:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://aegisops_test:isolated-test-only@postgres:5432/aegisops_test
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: isolated-test-only
      NEO4J_USERNAME: neo4j
      NEO4J_DATABASE: neo4j
      EMBEDDING_PROVIDER: fake
      QDRANT_COLLECTION_NAME: memories
      AUTH_MODE: local
      KAFKA_ENABLED: "false"
      AEGISOPS_INTEGRATION_TESTS: "1"
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      qdrant: {condition: service_started}
    command: ["sh", "-ec", "alembic upgrade head && python -m pytest -q -p no:cacheprovider"]
