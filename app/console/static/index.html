<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AegisOps Console</title>
  <meta name="description" content="Operational memory console for manufacturing reliability: incidents, evidence, and projection health.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z' fill='%231C4F91'/%3E%3Cpath d='M10 16h4l2-5 2 10 2-5h2' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/atkinson-hyperlegible-next-var.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="console.css?v=4eb95bed76">
  <script>
    try {
      var t = localStorage.getItem("aegis-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      if (localStorage.getItem("aegis-density") === "compact") document.documentElement.dataset.density = "compact";
      document.documentElement.dataset.view = localStorage.getItem("aegis-view") === "plant" ? "plant" : "admin";
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <header class="rail" aria-label="AegisOps">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z"/>
          <path class="brand-pulse" d="M10 16h4l2-5 2 10 2-5h2"/>
        </svg>
        <span class="brand-name">AegisOps</span>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
          <span class="visually-hidden">Menu</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>

      <nav id="primary-nav" class="nav" aria-label="Primary">
        <p class="nav-group">Operate</p>
        <ul>
          <li><a href="#/overview" data-route="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Plant overview</a></li>
          <li><a href="#/incidents" data-route="incidents"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></svg>Incidents</a></li>
          <li><a href="#/memories" data-route="memories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4H4zM4 11h16v4H4zM4 17h10"/></svg>Records</a></li>
          <li><a href="#/import" data-route="import"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>Import work orders</a></li>
        </ul>
        <p class="nav-group">Investigate</p>
        <ul>
          <li><a href="#/investigate" data-route="investigate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Investigate</a></li>
          <li><a href="#/search" data-route="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>Search</a></li>
          <li><a href="#/graph" data-route="graph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="m8.2 7 7.4.6M7 8.3l2.2 7.4M16.4 10 11.8 16"/></svg>Relationships</a></li>
        </ul>
        <p class="nav-group admin-only">Administration</p>
        <ul class="admin-only">
          <li><a href="#/evaluation" data-route="evaluation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Evaluation</a></li>
          <li><a href="#/system" data-route="system"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01"/></svg>System health</a></li>
        </ul>
      </nav>

      <div class="rail-foot">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
          <span>Dark display</span>
        </button>
        <button id="density-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
          <span>Compact layout</span>
        </button>
        <button id="view-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>
          <span>View as plant user</span>
        </button>
        <p id="view-meta" class="rail-meta" aria-live="polite"></p>
        <p class="rail-meta">Press <kbd>?</kbd> for keyboard shortcuts</p>
      </div>
    </header>

    <div class="workspace">
      <div class="statusbar" role="region" aria-label="Service status">
        <ul id="service-strip" class="service-strip"></ul>
        <span id="health-updated" class="statusbar-time" aria-live="off"></span>
      </div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title">
    <div class="dialog-inner"></div>
  </dialog>

</body>
</html>
