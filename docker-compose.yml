x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: [.env]
  environment: &app-env
    DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    QDRANT_URL: ${QDRANT_CONTAINER_URL:-http://qdrant:6333}
    NEO4J_URI: ${NEO4J_CONTAINER_URI:-bolt://neo4j:7687}
    NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aegisops}
    NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Sign-in (used when AUTH_MODE=oidc in .env). The issuer is the URL the
    # browser uses; the API fetches signing keys over the Docker network.
    OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/aegisops}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-aegisops-console}
    OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/aegisops/protocol/openid-connect/certs}
  networks: [aegisops-network]

services:
  api:
    <<: *app
    container_name: aegisops-api
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  postgres:
    image: postgres:16-alpine
    container_name: aegisops-postgres
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["aegisops_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [aegisops-network]
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc}
    container_name: aegisops-qdrant
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["aegisops_qdrant_storage:/qdrant/storage"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q 200'
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [aegisops-network]
  neo4j:
    image: neo4j:5.26-community
    container_name: aegisops-neo4j
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["aegisops_neo4j_data:/data", "aegisops_neo4j_logs:/logs"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aegisops}
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7687'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [aegisops-network]
  projection-worker:
    <<: *app
    container_name: aegisops-projection-worker
    command: ["python", "-m", "app.outbox.projection_worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  keycloak:
    # Sign-in provider for AUTH_MODE=oidc. Started with the "auth" profile
    # (COMPOSE_PROFILES=auth in .env). The realm, roles, console client and
    # starter users are imported from deploy/keycloak on first start.
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: aegisops-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change_me_keycloak}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:${KEYCLOAK_HOST_PORT:-8080}:8080"]
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
      - aegisops_keycloak_data:/opt/keycloak/data/h2
    restart: unless-stopped
    networks: [aegisops-network]
  kafka:
    profiles: [integration]
    image: apache/kafka:4.3.1
    container_name: aegisops-kafka
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["127.0.0.1:9092:19092"]
    volumes: ["aegisops_kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [aegisops-network]
  kafka-init:
    profiles: [integration]
    image: apache/kafka:4.3.1
    environment:
      KAFKA_PROJECTION_TOPIC: ${KAFKA_PROJECTION_TOPIC:-aegisops.memory.projections.v1}
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-ec", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$KAFKA_PROJECTION_TOPIC --partitions 3 --replication-factor 1"]
    networks: [aegisops-network]
  outbox-publisher:
    <<: *app
    profiles: [integration]
    container_name: aegisops-outbox-publisher
    environment:
      <<: *app-env
      KAFKA_ENABLED: "true"
    command: ["python", "-m", "app.outbox.publisher"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
    restart: unless-stopped
networks:
  aegisops-network: {driver: bridge}
volumes:
  aegisops_keycloak_data:
  aegisops_pgdata:
  aegisops_qdrant_storage:
  aegisops_neo4j_data:
  aegisops_neo4j_logs:
  aegisops_kafka_data:
